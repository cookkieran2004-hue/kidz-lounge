name: Nightly release to Kidz Lounge

# Kidz Lounge's Vercel project deploys the `production` branch; the Demo
# project deploys main. At 11:30 PM New York time, after the API's 11 PM
# release, this moves `production` up to main, and Vercel deploys it.
# If the API's release failed, it stops, so the site never runs ahead of the
# API it needs.
#
# GitHub schedules are in UTC, so there are two: only the one that lands on
# 11:30 PM in New York (summer or winter time) goes ahead.
# "Run workflow" on this workflow's Actions page = release now (urgent fixes).
on:
  schedule:
    - cron: '30 3 * * *' # 11:30 PM EDT (summer)
    - cron: '30 4 * * *' # 11:30 PM EST (winter)
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Is it 11:30 PM in New York?
        id: when
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            zone=$(TZ=America/New_York date +%Z)
            case "${{ github.event.schedule }}/$zone" in
              "30 3 * * */EDT"|"30 4 * * */EST") ;;
              *) echo "Not 11:30 PM in New York ($zone); the other schedule handles tonight."; echo go=false >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          echo go=true >> "$GITHUB_OUTPUT"

      - name: Check the API's release didn't fail
        if: steps.when.outputs.go == 'true'
        run: |
          run=$(curl -fsS "https://api.github.com/repos/${{ github.repository_owner }}/kidz-lounge-api/actions/workflows/release.yml/runs?per_page=1" \
            | jq -r '.workflow_runs[0] // empty | "\(.status) \(.conclusion)"')
          echo "API's latest release: ${run:-none yet}"
          case "$run" in
            ""|"completed success") ;;
            "completed "*) echo "::error::The API's release didn't succeed, so the website waits. Fix it, then use Run workflow on both repos."; exit 1 ;;
            *) echo "::error::The API's release is still running. Try Run workflow again in a few minutes."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'true'
        with:
          fetch-depth: 0

      - name: Release
        if: steps.when.outputs.go == 'true'
        run: |
          if git rev-parse -q --verify origin/production > /dev/null && [ "$(git rev-parse origin/production)" = "$(git rev-parse HEAD)" ]; then
            echo "Nothing new since the last release."; exit 0
          fi
          git push origin "${{ github.sha }}:refs/heads/production"
          echo "Released $(git rev-parse --short HEAD); Vercel deploys it to Kidz Lounge now."
